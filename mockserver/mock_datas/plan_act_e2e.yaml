# PlanAct e2e smoke script: create_plan -> shell_exec -> complete_step
# -> deliver_result. Used by backend/tests/test_e2e_plan_act.py via
# POST /mock/scenario.
#
# Dang dict {planner: [...], executor: [...]} (Issue #35) — truoc day la mot
# list don, va luot GOI DAU cua executor cung co dung 2 message (giong
# heuristic reset cua con tro toan cuc cu) nen bi "cuop" lai dong create_plan
# -> "Unknown tool: create_plan". Xem docs/design/dot-2-cli-engine.md muc 7.
planner:
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: create_plan
                arguments: |
                  {
                    "message": "I will run a quick smoke command.",
                    "language": "en",
                    "title": "E2E Smoke Task",
                    "goal": "Run a shell command and report the result",
                    "steps": [
                      {
                        "id": "1",
                        "description": "Run the smoke command"
                      }
                    ]
                  }

executor:
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: shell_exec
                arguments: |
                  {
                    "id": "e2e",
                    "exec_dir": "/home/ubuntu",
                    "command": "echo e2e-smoke-ok"
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: complete_step
                arguments: |
                  {
                    "success": true,
                    "result": "Smoke command executed",
                    "attachments": []
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: deliver_result
                arguments: |
                  {
                    "message": "E2E smoke finished",
                    "attachments": []
                  }
