# Canned PlanAct script: planner opens with create_plan (dung tool duy nhat
# PlannerAgent biet), executor chay het cac loai tool (message/file/search/
# shell/browser) roi complete_step + deliver_result (giai doan summarize).
#
# Dang dict {planner: [...], executor: [...]} — mockserver gan tung agent goi
# vao dung danh sach theo hash system prompt cua no (xem main.py, Issue #35).
# Truoc day day la list don (giao thuc "single-loop Manus" cua upstream, mo
# dau bang message_notify_user) — PlannerAgent cua PlanActFlow khong co tool
# do nen loi "Unknown tool: message_notify_user" ngay luot dau. Xem
# docs/design/dot-2-cli-engine.md muc 7.
planner:
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: create_plan
                arguments: |
                  {
                    "message": "I will run the mock Agent task end to end.",
                    "language": "en",
                    "title": "Mock Agent Task",
                    "goal": "Exercise message/file/search/shell/browser tools, then deliver a result",
                    "steps": [
                      {
                        "id": "1",
                        "description": "Run the mock Agent task"
                      }
                    ]
                  }

executor:
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: message_notify_user
                arguments: |
                  {
                      "text": "Starting the mock Agent task."
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: file_write
                arguments: |
                  {
                    "file": "/home/ubuntu/todo.md",
                    "content": "# Plan\n- [~] Run the mock Agent task\n",
                    "append": false
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: message_notify_user
                arguments: |
                  {
                      "text": "test message tools."
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: info_search_web
                arguments: |
                  {
                      "query": "latest AI developments 2024",
                      "date_range": "past_month"
                  }
        finish_reason: stop
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: file_write
                arguments: |
                  {
                      "file": "/home/ubuntu/example.txt",
                      "content": "New content\nSecond line",
                      "append": false,
                      "leading_newline": true,
                      "trailing_newline": true
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: file_write
                arguments: |
                  {
                      "file": "/home/ubuntu/example.md",
                      "content": "## Header\n\nThis is a test\n\n### Subheader",
                      "append": false,
                      "leading_newline": true,
                      "trailing_newline": true
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: file_write
                arguments: |
                  {
                      "file": "/home/ubuntu/example.py",
                      "content": "print('Hello, World!')",
                      "append": false,
                      "leading_newline": true,
                      "trailing_newline": true
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: shell_exec
                arguments: |
                  {
                      "id": "shell-1",
                      "exec_dir": "/home/ubuntu",
                      "command": "ls -a"
                  }
  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: browser_navigate
                arguments: |
                  {
                      "url": "https://www.example.com"
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: file_write
                arguments: |
                  {
                    "file": "/home/ubuntu/todo.md",
                    "content": "# Plan\n- [x] Run the mock Agent task\n",
                    "append": false
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: complete_step
                arguments: |
                  {
                    "success": true,
                    "result": "Mock Agent task finished",
                    "attachments": []
                  }

  - choices:
      - index: 0
        message:
          role: assistant
          content: null
          tool_calls:
            - type: function
              function:
                name: deliver_result
                arguments: |
                  {
                    "message": "This is a test",
                    "attachments": [
                      "/home/ubuntu/example.txt",
                      "/home/ubuntu/example.md",
                      "/home/ubuntu/example.py"
                    ]
                  }
